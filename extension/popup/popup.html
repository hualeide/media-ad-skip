<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Media Ad Skip</title>
  <style>
    body {
      margin: 0;
      width: 248px;
      font: 600 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", sans-serif;
      color: #f5f5f7;
      background: #1c1c1e;
      padding: 14px;
      letter-spacing: -0.01em;
    }
    h1 { margin: 0 0 4px; font-size: 15px; font-weight: 700; }
    #status {
      margin: 0 0 12px;
      font-weight: 400;
      font-size: 12px;
      opacity: .72;
      min-height: 1.3em;
      word-break: break-all;
    }
    label {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 7px 0;
      font-weight: 500;
      font-size: 12px;
    }
    .actions { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font: 600 12px/1.2 inherit;
      color: #fff;
      background: #0a84ff;
    }
    button.ghost {
      background: #2c2c2e;
      border: 1px solid #3a3a3c;
      color: #f5f5f7;
    }
    button:active { transform: scale(.97); }
  </style>
</head>
<body>
  <h1>Media Ad Skip</h1>
  <p id="status">读取中…</p>
  <label><input type="checkbox" id="autoSkip" /> 自动跳过</label>
  <label><input type="checkbox" id="useSponsorBlock" /> SponsorBlock</label>
  <label><input type="checkbox" id="douyinInVideo" /> 抖音片内广告</label>
  <label><input type="checkbox" id="douyinFeedAd" /> 信息流广告</label>
  <label><input type="checkbox" id="douyinFeedLive" /> 划走直播卡</label>
  <div class="actions">
    <button type="button" id="skipNow">立即跳过</button>
    <button type="button" id="reanalyze" class="ghost">重新分析</button>
    <button type="button" id="undo" class="ghost">撤销跳过</button>
    <button type="button" id="block" class="ghost">本集不跳</button>
    <button type="button" id="wrong" class="ghost">标错了</button>
    <button type="button" id="reloadTab" class="ghost">刷新当前页</button>
    <button type="button" id="openOptions" class="ghost">打开设置页</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>

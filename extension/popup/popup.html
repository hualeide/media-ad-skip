<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Media Ad Skip</title>
  <style>
    :root {
      --bg: #1c1c1e;
      --bg-elevated: #2c2c2e;
      --bg-row: #2c2c2e;
      --sep: rgba(84, 84, 88, 0.65);
      --label: #f5f5f7;
      --secondary: rgba(235, 235, 245, 0.6);
      --blue: #0a84ff;
      --blue-pressed: #0071e3;
      --fill: #3a3a3c;
      --green: #30d158;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 280px;
      font: 400 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
      color: var(--label);
      background: var(--bg);
      padding: 16px 14px 14px;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      margin: 0 0 14px;
      padding: 0 2px;
    }
    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    #status {
      margin: 4px 0 0;
      font-size: 12px;
      font-weight: 400;
      color: var(--secondary);
      min-height: 1.3em;
      word-break: break-all;
    }
    .group {
      background: var(--bg-row);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 14px;
      min-height: 44px;
    }
    .row + .row {
      border-top: 0.5px solid var(--sep);
    }
    .row-label {
      font-size: 15px;
      font-weight: 400;
      letter-spacing: -0.01em;
    }
    /* iOS switch */
    .switch {
      position: relative;
      width: 51px;
      height: 31px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }
    .switch .track {
      position: absolute;
      inset: 0;
      background: var(--fill);
      border-radius: 31px;
      transition: background 0.2s ease;
      cursor: pointer;
    }
    .switch .knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16);
      transition: transform 0.22s cubic-bezier(0.4, 0.0, 0.2, 1);
      pointer-events: none;
    }
    .switch input:checked + .track {
      background: var(--green);
    }
    .switch input:checked + .track .knob {
      transform: translateX(20px);
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 11px 14px;
      cursor: pointer;
      font: 590 15px/1.2 inherit;
      letter-spacing: -0.01em;
      color: var(--blue);
      background: var(--bg-elevated);
      transition: opacity 0.12s ease, transform 0.08s ease;
    }
    button.primary {
      color: #fff;
      background: var(--blue);
      font-weight: 600;
    }
    button:active {
      opacity: 0.72;
      transform: scale(0.985);
    }
    button.primary:active {
      background: var(--blue-pressed);
      opacity: 1;
    }
    .footnote {
      margin: 10px 2px 0;
      font-size: 11px;
      color: var(--secondary);
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Media Ad Skip</h1>
    <p id="status">读取中…</p>
  </div>

  <div class="group">
    <label class="row">
      <span class="row-label">自动跳过</span>
      <span class="switch">
        <input type="checkbox" id="autoSkip" />
        <span class="track"><span class="knob"></span></span>
      </span>
    </label>
    <label class="row">
      <span class="row-label">划走直播和广告</span>
      <span class="switch">
        <input type="checkbox" id="feedSwipe" />
        <span class="track"><span class="knob"></span></span>
      </span>
    </label>
  </div>

  <div class="actions">
    <button type="button" id="reanalyze" class="primary">重新分析</button>
    <button type="button" id="undo">撤销跳过</button>
    <button type="button" id="block">本集不跳</button>
    <button type="button" id="wrong">标错了</button>
    <button type="button" id="reloadTab">刷新当前页</button>
    <button type="button" id="openOptions">打开设置页</button>
  </div>
  <p class="footnote">SponsorBlock、片内广告等详见设置页。</p>
  <script src="popup.js"></script>
</body>
</html>
